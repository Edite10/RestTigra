<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{% block title %}{% block head_title %}{% endblock %} - Hotel Tigra{% endblock %}</title>

    {% load static %}
    <!-- Load Tailwind CSS before your custom styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    {% block extra_head %}{% endblock %}
    <style>
        /* Hide Django Messages after a delay */
        .django-messages {
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }
        .django-messages.fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>
    {% block content %}
    {% endblock %}

    <script src="{% static 'js/script.js' %}"></script>
    <script>
        // Auto-hide Django messages after 5 seconds
        document.addEventListener('DOMContentLoaded', function() {
            const messages = document.querySelectorAll('.django-messages');
            if (messages.length > 0) {
                setTimeout(function() {
                    messages.forEach(function(message) {
                        message.classList.add('fade-out');
                        setTimeout(function() {
                            message.style.display = 'none';
                        }, 500);
                    });
                }, 5000);
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
